# Render's free plan sleeps after 15 minutes without visitors, and waking takes about a minute.
# This pings the health check every 10 minutes during judging so judges never see the slow first load.
name: Keep demo awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://termsheet-tgwl.onrender.com/api/health
